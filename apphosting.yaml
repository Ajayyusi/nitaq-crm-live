# Firebase App Hosting — PRODUCTION backend for the Nitaq CRM (Next.js 16).
#
# Project: nitaq-crm · backend: nitaq-crm (see firebase.json)
# Replaces the Vercel deployment and uses the same production MongoDB. Before
# the first deploy: back up the database and run the duplicate-postings check
# against it (SYSTEM_AUDIT.md §3), then apply the audit's index migration.
#
# No secret values live in this file or in git. The project owner creates
# them once, from their own terminal:
#   firebase apphosting:secrets:set MONGODB_URI --project nitaq-crm
#   firebase apphosting:secrets:set AUTH_SECRET --project nitaq-crm
# (AUTH_SECRET: reuse the Vercel value so nobody is signed out at cutover.)
#
# MongoDB Atlas: App Hosting runs on Cloud Run without a fixed outbound IP,
# so the cluster's Network Access list must allow it. Create the backend in
# the Google Cloud region closest to the Atlas cluster — distance between the
# server and the database is most of the per-request lag.

runConfig:
  # One instance always warm: no cold-start wait after quiet periods.
  minInstances: 1
  maxInstances: 4
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # Production database connection string.
  # BUILD as well as RUNTIME: `next build` imports route modules while
  # collecting page data.
  - variable: MONGODB_URI
    secret: MONGODB_URI
    availability:
      - BUILD
      - RUNTIME

  # NextAuth session signing key.
  - variable: AUTH_SECRET
    secret: AUTH_SECRET
    availability:
      - RUNTIME

  # The app resolves its own URL from the request host (auth.ts sets
  # trustHost), so the *.hosted.app address works without AUTH_URL.
  - variable: AUTH_TRUST_HOST
    value: "true"
    availability:
      - BUILD
      - RUNTIME
